# One-click deployment to Render (free plan): web service + PostgreSQL.
# Deploy: https://render.com/deploy?repo=https://github.com/ksvtmr/isker
services:
  - type: web
    name: isker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: isker-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: MOCK_AI
        value: "true"
      # Public demo account for reviewers (contains only seeded demo data).
      - key: DEMO_PASSWORD
        value: IskerDemo2026
      # Asked for during deployment; never stored in the repository.
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: isker-db
    plan: free
    databaseName: isker
    user: isker
