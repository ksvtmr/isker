# Render Blueprint: web service (API + built frontend in one Docker image) + PostgreSQL. See DEPLOYMENT.md.
# First setup: https://render.com/deploy?repo=https://github.com/ksvtmr/isker
#
# Releases: Render deploys the `main` branch only after the GitHub checks of that commit pass (CI in
# .github/workflows/ci.yml). Pull requests get a preview environment when their title contains
# "[render preview]" (needs a Render workspace plan with Preview Environments); each preview gets its own new,
# empty database seeded with demo data, never the production database.
previews:
  generation: manual
  expireAfterDays: 3

services:
  - type: web
    name: isker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    branch: main
    autoDeployTrigger: checksPass
    # Render switches traffic only after this returns 200 (API up and database reachable); otherwise the previous
    # release keeps serving and the deploy is marked failed.
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: isker-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      # Render's load balancer is the one proxy in front of the app (client IP for rate limits).
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # The interface is also published on GitHub Pages (.github/workflows/pages.yml) and calls this API from there.
      - key: CORS_ORIGINS
        value: https://ksvtmr.github.io
      # Email links use RENDER_EXTERNAL_URL automatically. Without SMTP_* variables no email is sent
      # (EMAIL_BACKEND=auto → disabled in production) and the app says so honestly.
      # Built-in rule-based AI until a key is set. For Gemini: put GEMINI_API_KEY in Render → Environment (secret,
      # never in this file), then set MOCK_AI=false and AI_PROVIDER=gemini there. A missing key stops the deploy with
      # a clear error instead of silently using the rule-based provider.
      - key: MOCK_AI
        value: "true"
      # Public demo account for reviewers (contains only seeded demo data).
      - key: DEMO_PASSWORD
        value: IskerDemo2026
      # Asked for during deployment; never stored in the repository.
      - key: ADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Optional: "Continue with Google" stays disabled until both are set (docs/google-oauth-setup.md).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  - name: isker-db
    plan: free
    databaseName: isker
    user: isker
