# Isker — run everything with:  docker compose up --build
# App: http://localhost:8080   API docs: http://localhost:8000/api/docs
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-isker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-isker}
      POSTGRES_DB: ${POSTGRES_DB:-isker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Exposed for local development with hot reload (backend runs on the host). Change the left
      # number (e.g. "5433:5432") if PostgreSQL is already installed on your machine.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-isker} -d ${POSTGRES_DB:-isker}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-isker}:${POSTGRES_PASSWORD:-isker}@postgres:5432/${POSTGRES_DB:-isker}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  pgdata:
